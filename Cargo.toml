[package]
name = "etag-for-codex"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Strong snapshot ETags, typed Rust batches and OpenAI Batch API adapters"
license-file = "LICENSE"
publish = false
include = ["src/**", "examples/**", "tests/**", "fixtures/**", "scripts/*.py", "integrations/**", ".github/workflows/**", "docs/PROTOCOL.md", "docs/DURABILITY.md", "docs/COMPATIBILITY.md", "docs/VALIDATION.md", "docs/PUBLICATION.md", "docs/ENUMS.md", "docs/USAGE.md", "README.md", "wallets.txt", "LICENSE", "COMMERCIAL-LICENSE.md", "SECURITY.md", "THIRD-PARTY-NOTICES.md", "CONTRIBUTING.md", "CHANGELOG.md", "Cargo.toml", "Cargo.lock"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.43.0", features = ["bundled"] }

[features]
default = []
openai-http = ["dep:reqwest"]

[dependencies.reqwest]
version = "0.12.28"
optional = true
default-features = false
features = ["blocking", "json", "multipart", "rustls-tls"]
