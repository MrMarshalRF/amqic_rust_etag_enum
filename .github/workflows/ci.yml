name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and quality tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup component add rustfmt clippy --toolchain 1.99.1
          rustup default 1.99.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.features }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features: [--no-default-features, --all-features]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tested Rust
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Unit, CLI, API, socket and process-restart tests
        run: cargo test --locked --all-targets ${{ matrix.features }}
  msrv:
    name: Minimum Rust 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared minimum Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
      - run: cargo check --locked --all-targets --all-features
  documentation:
    name: Documentation and doctests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - run: cargo doc --locked --all-features --no-deps
      - run: cargo test --locked --doc --all-features
  release:
    name: Optimized build and restart tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - run: cargo test --release --locked --all-targets --all-features
      - run: cargo build --release --locked --all-features --bins
      - name: Check Cargo source-package inventory
        run: cargo package --list --locked --allow-dirty --offline
  publication:
    name: Publication integrity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Offline producer and VirusTotal-runner tests
        run: |
          python -B scripts/test_prepare_repository.py
          python -B scripts/test_virustotal_review.py
      - name: Export committed files and verify exact source archive
        shell: python
        run: |
          import io, os, pathlib, subprocess, sys, tarfile
          source = pathlib.Path(os.environ["RUNNER_TEMP"]) / "etag-committed"
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "etag-artifacts"
          source.mkdir()
          archived = subprocess.run(["git", "archive", "HEAD"], check=True, stdout=subprocess.PIPE)
          with tarfile.open(fileobj=io.BytesIO(archived.stdout)) as archive:
              archive.extractall(source, filter="data")
          subprocess.run([sys.executable, "-B", "scripts/ci_checks.py", "--source", str(source), "--output", str(output)], check=True)
      - name: Retain verified source archive and manifest
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/etag-artifacts/source.zip
            ${{ runner.temp }}/etag-artifacts/publication.json
          if-no-files-found: error
          retention-days: 7
  security:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and cargo-audit
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit
  ci:
    name: CI complete
    if: always()
    needs: [quality, test, msrv, documentation, release, publication, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os,sys; results=json.loads(os.environ["RESULTS"]); failed={k:v["result"] for k,v in results.items() if v["result"]!="success"}; print(json.dumps(failed or {"ci":"success"})); sys.exit(bool(failed))'
